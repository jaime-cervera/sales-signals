name: Feature Request
description: Suggest a new feature or improvement
labels: ["enhancement"]
body:
  - type: checkboxes
    id: search
    attributes:
      label: Existing issues
      options:
        - label: I searched existing issues and this hasn't been requested yet
          required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this solve? Why do you need this?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How would you like this to work?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Signal discovery (Unipile / ATS / WebSearch)
        - Account-fit scoring
        - Decision-maker contacts
        - CRM / tracker integrity
        - Multi-ICP / path resolution
        - Dashboard TUI
        - Batch processing
        - Documentation
        - Other
    validations:
      required: true
